server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # The app stores everything in the browser (localStorage), so no caching of HTML
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Let phones add it to the home screen cleanly
    add_header X-Content-Type-Options "nosniff";
}
