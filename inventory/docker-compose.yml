# Standalone deploy for the move-inventory app — run this on your homelab:
#
#   cd inventory && docker compose up -d --build
#
# Then open http://<homelab-ip>:8088 on your phone (same Wi-Fi) and
# "Add to Home Screen". Data is stored per-device in the browser.
services:
  move-inventory:
    build: .
    image: move-inventory:latest
    container_name: move-inventory
    restart: unless-stopped
    ports:
      - "${INVENTORY_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
